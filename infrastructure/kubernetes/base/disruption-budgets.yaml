apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: kynorix
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: kynorix-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker
  namespace: kynorix
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: kynorix-worker
