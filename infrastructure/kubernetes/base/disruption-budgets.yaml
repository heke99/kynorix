apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: zoryqon
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: zoryqon-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker
  namespace: zoryqon
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: zoryqon-worker
