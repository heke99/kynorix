apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: kynorix
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kynorix-worker
  template:
    metadata:
      labels:
        app: kynorix-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: registry.example.invalid/kynorix/worker:replace-with-signed-digest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: kynorix-worker-runtime
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
