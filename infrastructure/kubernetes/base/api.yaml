apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: zoryqon
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zoryqon-api
  template:
    metadata:
      labels:
        app: zoryqon-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: registry.example.invalid/zoryqon/api:replace-with-signed-digest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - secretRef:
                name: zoryqon-api-runtime
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: zoryqon
spec:
  selector:
    app: zoryqon-api
  ports:
    - name: http
      port: 4000
      targetPort: http
