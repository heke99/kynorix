apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: kynorix-sandbox
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kynorix-api
  template:
    metadata:
      labels:
        app: kynorix-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: registry.example.invalid/kynorix/api:replace-with-signed-digest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: KYNORIX_SANDBOX_MODE
              value: 'true'
            - name: KYNORIX_REAL_MONEY_ENABLED
              value: 'false'
            - name: KYNORIX_FIVE_MINUTE_MARKETS_ENABLED
              value: 'false'
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: kynorix-sandbox
spec:
  selector:
    app: kynorix-api
  ports:
    - name: http
      port: 4000
      targetPort: http
