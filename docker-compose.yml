services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: zoryqon
      POSTGRES_USER: zoryqon
      POSTGRES_PASSWORD: zoryqon_local
    ports:
      - '5432:5432'
    volumes:
      - zoryqon_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zoryqon -d zoryqon']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.2-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - zoryqon_redis:/data

  redpanda:
    image: redpandadata/redpanda:v24.3.8
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports:
      - '9092:9092'

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: zoryqon
      MINIO_ROOT_PASSWORD: local-development-only
    ports:
      - '9001:9001'
      - '9002:9000'
    volumes:
      - zoryqon_minio:/data

volumes:
  zoryqon_postgres:
  zoryqon_redis:
  zoryqon_minio:
